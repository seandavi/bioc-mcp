name: Deploy
# Deploys only from main: pushes, the daily docs-index rebuild, the docs site's dispatch, or by hand.
# The production environment is restricted to main and holds CLOUDFLARE_API_TOKEN (copied from
# GCP Secret Manager; see docs/deploy.md). Pull requests run ci.yml, which has no secrets.
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * *'
  repository_dispatch:
    types: [docs-updated]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://bioc-mcp.seandavi.workers.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run docs:build
        env:
          GITHUB_TOKEN: ${{ github.token }}  # rate limit only: the build reads public seandavi/* repos
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-index
          path: generated/
          retention-days: 14
      - name: Deploy
        run: npx wrangler deploy --message "$DEPLOY_MESSAGE"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_MESSAGE: ${{ github.event_name }} ${{ github.sha }}
