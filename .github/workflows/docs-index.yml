name: Docs index
on:
  schedule:
    - cron: '23 6 * * *'
  repository_dispatch:
    types: [docs-updated]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-index
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: docs-index
          path: generated/
          retention-days: 14
